name: Events Demo 1
on:
  pull_request:
    types: [opened, closed]
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore: 
      - '.github/workflows/*' # trigger will not run this workflow if only this file changed

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Output event data
        run: echo "${{ toJSON(github.event) }}"
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Test code
        run: npm run test
      - name: Build code
        run: npm run build
      - name: Deploy project
        run: echo "Deploying..."